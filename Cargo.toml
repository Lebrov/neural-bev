[workspace]
resolver = "2"
members = [
    "crates/neuralbev-core",
    "crates/neuralbev-macros",
    "runtime",
    "editor",
    "examples",
]

[workspace.package]
version      = "0.1.0"
edition      = "2021"
authors      = ["NeuralBev Contributors"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/your-org/neuralbev"
rust-version = "1.80"

# ──────────────────────────────────────────────────────────────────
# Shared dependency versions — bump here, not in individual crates.
# ──────────────────────────────────────────────────────────────────
[workspace.dependencies]
# Engine
bevy            = { version = "0.15", default-features = false, features = [
    "bevy_asset", "bevy_scene", "bevy_sprite", "bevy_text",
    "bevy_render", "bevy_core_pipeline", "bevy_pbr",
    "bevy_winit", "bevy_gizmos", "dynamic_linking",
] }

# Serialization
serde           = { version = "1", features = ["derive"] }
serde_yaml      = "0.9"
serde_json      = "1"

# Scripting
mlua            = { version = "0.10", features = ["lua54", "vendored"] }

# Physics (optional features)
bevy_rapier2d   = { version = "0.27", optional = true }
bevy_rapier3d   = { version = "0.27", optional = true }

# Macros
syn             = { version = "2", features = ["full"] }
quote           = "1"
proc-macro2     = "1"

# Utilities
thiserror       = "1"
log             = "0.4"
uuid            = { version = "1", features = ["v4"] }

[profile.dev]
opt-level     = 1          # faster compile, decent runtime

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
