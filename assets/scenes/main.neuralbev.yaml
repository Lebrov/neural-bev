# AI-HINT: Это файл сцены NeuralBev. Каждая сущность — объект под ключом entities.
# Компоненты — словарь под ключом components.
# Дочерние сущности — массив под ключом children.
# Числа ВСЕГДА должны быть float (100.0, не 100).

meta:
  engine_version: "0.1.0"
  scene_name: "MainLevel"

entities:
